# ============================================================
# netlify.toml — Canonical Netlify configuration
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# ============================================================

[build]
  # Static site — no build command required.
  # Publish from repo root.
  publish = "."
  command = ""

# ------------------------------------------------------------
#  Pretty URLs & trailing slash handling
# ------------------------------------------------------------
[build.processing]
  skip_processing = false
[build.processing.html]
  pretty_urls = true
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.images]
  compress = true

# ------------------------------------------------------------
#  Deploy contexts — production vs preview
# ------------------------------------------------------------
[context.production]
  command = ""
  publish = "."

[context.deploy-preview]
  command = ""
  publish = "."

[context.branch-deploy]
  command = ""
  publish = "."

# ------------------------------------------------------------
#  Redirects
# ------------------------------------------------------------
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# SPA-style fallback (safe for static — 404s still return real 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}
  force = false

# ------------------------------------------------------------
#  Security headers (also mirrored in /_headers for redundancy)
# ------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://plausible.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://plausible.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Long cache for hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for HTML — always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
